const D=n=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d};
function mm(t){const[h,m]=t.split(':');return +h*60+ +m}
const T=t=>{const[h,m]=t.split(':').map(Number);return(h<12?'오전 ':'오후 ')+(h%12||12)+':'+String(m).padStart(2,'0')};
